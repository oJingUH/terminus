# Builds the GUI + CLI executables for every OS and publishes them as a
# GitHub Release. Runs only when a version tag is pushed (git tag v1.0.0 &&
# git push origin v1.0.0), never on ordinary pushes. "Run workflow" in the
# Actions tab does a dry run: same builds, uploaded as workflow artifacts,
# no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows would otherwise encode redirected output as cp1252 and crash on
  # the bank's non-cp1252 characters. Packaged builds set this themselves.
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
          - os: macos-latest      # Apple silicon
          - os: macos-15-intel    # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      # Qt's xcb platform plugin links against these. Installing them on the
      # build host lets PyInstaller bundle them, so the Linux build runs on
      # desktops that lack them (libxcb-cursor0 is commonly missing).
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - run: pip install -r packaging/requirements.txt

      - name: Self-test from source
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for mode in "" --ports --cipher --crypto --review "--breach net"; do
            python terminus_cli.py --selftest $mode > /dev/null
          done
          python terminus_gui.py --selftest

      # Builds, runs the frozen self-tests, and writes one archive to dist/.
      - name: Build
        run: python packaging/build.py --version ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A hyphenated tag (v1.0.0-rc.1) publishes as a pre-release.
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
